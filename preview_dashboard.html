<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Supabase 연동 실시간 상품 및 매장 통합 관리 대시보드 시스템 프리뷰" />
  <title>매장 및 상품 통합 관리 시스템 - Local Preview</title>
  
  <!-- CDNs for React, Babel, and Supabase -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* 글로벌 다크 테마 변수 및 공통 스타일 (src/index.css + src/App.css 통합) */
    :root {
      --bg-main: #121214;
      --bg-card: rgba(30, 30, 36, 0.7);
      --bg-sidebar: #0f0f11;
      --border-color: rgba(45, 45, 52, 0.6);
      --color-mint: #00f5d4;
      --color-mint-hover: #3db5a7;
      --color-blue: #00b4d8;
      --color-blue-hover: #0096b4;
      --color-danger: #ef4444;
      --color-danger-bg: rgba(239, 68, 68, 0.15);
      --text-primary: #f3f4f6;
      --text-muted: #9ca3af;
      --font-main: 'Inter', 'Malgun Gothic', sans-serif;
      --font-title: 'Outfit', 'Malgun Gothic', sans-serif;
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Elegant Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: #3e3e4a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-mint);
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--glass-shadow);
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-main);
      overflow: hidden;
    }

    /* 사이드바 */
    .sidebar {
      width: 240px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    .sidebar-title {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 700;
      color: var(--color-mint);
      text-align: center;
      margin-bottom: 32px;
      letter-spacing: 1.5px;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .menu-item {
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .menu-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .menu-item.active {
      background-color: rgba(0, 245, 212, 0.1);
      color: var(--color-mint);
      border-left: 3px solid var(--color-mint);

      border-bottom-left-radius: 0;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);

      flex-direction: column;
      gap: 8px;
    }

    .user-tag {

    }

    .btn-logout {

    }

    /* 지표 카드 */

    }

    .metric-card {

    .metric-title {

    .metric-value {
      font-size: 26px;

    }

    .metric-value.mint {
      color: var(--color-mint);

    /* 버튼 스타일 */

    .btn-secondary {

    .btn-danger {

    .btn-danger:hover {

    /* 입력 필드 */
    .input-control {

    /* 테이블 */
    .table-container {

    .custom-table {

    .custom-table th {

    }

    .custom-table tr.warning-row td {

    /* 모달 */
    .modal-overlay {

      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;

    .modal-content {

      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;

    .modal-header {

      justify-content: space-between;
      align-items: center;

    .modal-title {

      font-size: 18px;
      font-weight: 600;
    }

    .modal-body {

    }

    .form-group {

    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    /* 로그인 */
    .login-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-main);
    }

    .login-card {
      width: 380px;
      padding: 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-title {
      font-family: var(--font-title);

      font-weight: 700;

    /* 직원 탭 스플리터 */
    .splitter-container {
      display: flex;
      gap: 24px;
      height: 100%;

    .splitter-left {

      display: flex;

      gap: 16px;
    }
    .splitter-right {
      flex: 6;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 정산 요약 */
    .payroll-box {
      background-color: #1e1e24;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;

    .payroll-summary-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 20px;
      font-size: 13px;
    }

    .payroll-summary-label {
      color: var(--text-muted);
    }

    .payroll-summary-value {
      font-weight: bold;
      text-align: right;
    }

    .payroll-summary-value.highlight {

      font-size: 16px;
    }

    .status-tag {
      display: inline-block;

      color: var(--color-mint);
    }

    .status-tag.unsettled {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--color-danger);
    }

    /* --- 대시보드 개선: 달력 및 디지털 메모장 스타일 --- */

      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      margin-top: 24px;
      align-items: start;
    }
    
    .dashboard-left-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }
    
    .dashboard-right-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    
    .calendar-container {
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .calendar-title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .calendar-title-wrapper h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);

    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 8px;

    .calendar-btn {

      border: 1px solid var(--border-color);

    .calendar-day-header {

    .calendar-sales-amount {

    /* 디지털 메모장 보드 */
    .memo-board-container {

    .memo-board-header {

<body>
  <div id="root"></div>

  <!-- React 및 컴포넌트 렌더링 스크립트 -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Supabase 클라이언트 생성
    const supabaseUrl = 'https://vrdbdtjmbitotbizknnd.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyZGJkdGptYml0b3RiaXprbm5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NTI1MDgsImV4cCI6MjA5NjAyODUwOH0.EVSdhqSTwuQOyJFmak-Zz-ixBkOavIJzCLTK3yYBHIU';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

    // ==========================================
    // 1. 로그인 컴포넌트
    // ==========================================
    function Login({ onLoginSuccess }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!username.trim() || !password.trim()) {
          setError('아이디와 비밀번호를 모두 입력해 주세요.');
          return;
        }

        setLoading(true);
        setError('');

        try {
          const { data, error: dbError } = await supabaseClient
            .from('users')
            .select('*')
            .eq('username', username.trim())
            .eq('password', password.trim())
            .eq('role', 'admin')
            .single();

          if (dbError || !data) {
            setError('아이디 또는 비밀번호가 일치하지 않거나, 관리자 권한이 없습니다.');
          } else {
            onLoginSuccess(data);
          }
        } catch (err) {
          console.error(err);
          setError('네트워크 오류가 발생했습니다.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-container">
          <div className="login-card glass-card">
            <h1 className="login-title">STORE MANAGER</h1>
            <p className="login-subtitle">로컬 프리뷰 모드로 로그인해 주세요.</p>
            {error && (
              <div style={{ color: 'var(--color-danger)', fontSize: '12px', textAlign: 'center', backgroundColor: 'var(--color-danger-bg)', padding: '8px', borderRadius: '4px' }}>
                {error}
              </div>
            )}
            <form onSubmit={handleLogin} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div className="form-group">
                <input
                  type="text"
                  className="input-control"
                  placeholder="관리자 ID (기본: admin)"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  disabled={loading}
                  style={{ height: '42px' }}
                />
              </div>
              <div className="form-group">
                <input
                  type="password"
                  className="input-control"
                  placeholder="비밀번호 (기본: admin123)"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  disabled={loading}
                  style={{ height: '42px' }}
                />
              </div>
              <button type="submit" className="btn btn-primary" disabled={loading} style={{ height: '45px', marginTop: '10px' }}>
                {loading ? '로그인 중...' : '로그인'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. 사이드바 컴포넌트
    // ==========================================
    function Sidebar({ activeTab, setActiveTab, user, onLogout }) {
      const menus = [
        { name: '대시보드', id: 'dashboard' },
        { name: '고객 정보 관리', id: 'customers' },
        { name: '상품 및 재고 관리', id: 'products' },
        { name: '직원 및 급여 정산', id: 'employees' },
        { name: '매출 및 순수익 통계', id: 'finance' },
      ];

      return (
        <div className="sidebar">
          <h2 className="sidebar-title">STORE ADMIN</h2>
          <div className="sidebar-menu">
            {menus.map((menu) => (
              <button
                key={menu.id}
                className={`menu-item ${activeTab === menu.id ? 'active' : ''}`}
                onClick={() => setActiveTab(menu.id)}
              >
                {menu.name}
              </button>

          </div>
          <div className="sidebar-footer">
            <div className="user-tag">접속자: {user?.name || '관리자'} 님</div>
            <button className="btn-logout" onClick={onLogout}>로그아웃</button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. 대시보드 컴포넌트
    // ==========================================
    function Dashboard() {
      const [metrics, setMetrics] = useState({ todaySales: 0, monthNetProfit: 0, totalProducts: 0, lowStockProducts: 0 });
      const [recentSales, setRecentSales] = useState([]);
      const [loading, setLoading] = useState(true);
      
      // 달력 관련 상태
      const [currentDate, setCurrentDate] = useState(new Date());
      const [monthlySales, setMonthlySales] = useState({});

      // 디지털 메모장(포스트잇) 상태
      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('dashboard_sticky_notes');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [
          {
            id: 1,
            text: "환영합니다!\n\n1. 메모지는 상단 헤더를 잡아 드래그로 이동할 수 있습니다.\n2. 우측 하단 모서리를 드래그해 크기를 변경합니다.\n3. 메모 영역 밖으로는 나갈 수 없게 제한되어 있습니다.\n4. 새로고침해도 메모 위치와 내용이 그대로 유지됩니다.",
            color: "yellow",
            x: 20,
            y: 40,
            w: 220,
            h: 180
          },
          {
            id: 2,
            text: "중요 공지:\n금주 주말 재고 실사 예정\n(재고 부족 품목 우선 발주 요망)",
            color: "mint",
            x: 260,
            y: 120,
            w: 200,
            h: 140
          }
        ];
      });

      const boardRef = useRef(null);

      useEffect(() => {
        fetchDashboardData();
        fetchCalendarSales(currentDate);
      }, [currentDate]);

      const fetchDashboardData = async () => {
        setLoading(true);
        try {
          const localDate = new Date();
          const year = localDate.getFullYear();
          const month = String(localDate.getMonth() + 1).padStart(2, '0');
          const day = String(localDate.getDate()).padStart(2, '0');
          const todayStr = `${year}-${month}-${day}`;
          const thisMonthStr = `${year}-${month}`;

          // 금일 매출
          const { data: todaySalesData } = await supabaseClient.from('sales').select('quantity, selling_price').eq('sale_date', todayStr);
          const todaySalesSum = (todaySalesData || []).reduce((sum, item) => sum + item.quantity * item.selling_price, 0);

          // 당월 통계
          const { data: monthSalesData } = await supabaseClient.from('sales').select('quantity, selling_price').like('sale_date', `${thisMonthStr}%`);
          const monthSalesSum = (monthSalesData || []).reduce((sum, item) => sum + item.quantity * item.selling_price, 0);

          const { data: monthPurchasesData } = await supabaseClient.from('purchases').select('quantity, purchase_price').like('purchase_date', `${thisMonthStr}%`);
          const monthPurchasesSum = (monthPurchasesData || []).reduce((sum, item) => sum + item.quantity * item.purchase_price, 0);

          const { data: monthPayrollData } = await supabaseClient.from('payrolls').select('calculated_salary').like('settlement_date', `${thisMonthStr}%`);
          const monthPayrollSum = (monthPayrollData || []).reduce((sum, item) => sum + item.calculated_salary, 0);

          const netProfit = monthSalesSum - (monthPurchasesSum + monthPayrollSum);

          // 등록 상품 수 및 재고 부족
          const { count: totalProds } = await supabaseClient.from('products').select('*', { count: 'exact', head: true });
          const { count: lowStockProds } = await supabaseClient.from('products').select('*', { count: 'exact', head: true }).lte('stock_qty', 10);

          setMetrics({
            todaySales: todaySalesSum,
            monthNetProfit: netProfit,
            totalProducts: totalProds || 0,
            lowStockProducts: lowStockProds || 0
          });

          // 최근 매출 내역 5건
          const { data: salesList } = await supabaseClient
            .from('sales')
            .select(`id, sale_date, quantity, selling_price, products (code, name)`)
            .order('id', { ascending: false })
            .limit(5);

          const formattedSales = (salesList || []).map((sale) => ({
            id: sale.id,
            sale_date: sale.sale_date,
            code: sale.products?.code || '-',
            name: sale.products?.name || '삭제된 상품',
            quantity: sale.quantity,
            selling_price: sale.selling_price,
            total_amount: sale.quantity * sale.selling_price,
          }));

          setRecentSales(formattedSales);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const fetchCalendarSales = async (date) => {
        try {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const startStr = `${year}-${month}-01`;
          const endStr = `${year}-${month}-${new Date(year, date.getMonth() + 1, 0).getDate()}`;
          
          const { data, error } = await supabaseClient
            .from('sales')
            .select('sale_date, quantity, selling_price')
            .between('sale_date', startStr, endStr);
            
          if (error) throw error;
          
          const mapped = {};
          (data || []).forEach(item => {
            const dateStr = item.sale_date;
            if (!mapped[dateStr]) {
              mapped[dateStr] = { count: 0, total: 0 };
            }
            mapped[dateStr].count += item.quantity;
            mapped[dateStr].total += item.quantity * item.selling_price;
          });
          setMonthlySales(mapped);
        } catch (err) {
          console.error('Calendar sales error:', err);
        }
      };

      // 달력 네비게이션
      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

      const handlePrevMonth = () => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      };

      const handleNextMonth = () => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
      };

      // 포스트잇 기능 구현
      const addStickyNote = () => {
        const newNote = {
          id: Date.now(),
          text: '',
          color: 'yellow',
          x: 40,
          y: 40,
          w: 180,
          h: 140
        };
        setNotes(prev => {
          const updated = [...prev, newNote];
          localStorage.setItem('dashboard_sticky_notes', JSON.stringify(updated));
          return updated;
        });
      };

      const deleteStickyNote = (noteId) => {
        setNotes(prev => {
          const updated = prev.filter(n => n.id !== noteId);
          localStorage.setItem('dashboard_sticky_notes', JSON.stringify(updated));
          return updated;
        });
      };

      const updateNoteText = (noteId, text) => {
        setNotes(prev => {
          const updated = prev.map(n => n.id === noteId ? { ...n, text } : n);
          localStorage.setItem('dashboard_sticky_notes', JSON.stringify(updated));
          return updated;
        });
      };

      const changeNoteColor = (noteId, color) => {
        setNotes(prev => {
          const updated = prev.map(n => n.id === noteId ? { ...n, color } : n);
          localStorage.setItem('dashboard_sticky_notes', JSON.stringify(updated));
          return updated;
        });
      };

      // 포스트잇 드래그 이동 핸들러
      const handleMouseDownNote = (e, noteId) => {
        if (e.button !== 0) return; // 좌클릭만 허용
        if (e.target.closest('.btn-delete-note') || e.target.closest('.color-dot') || e.target.closest('.resize-handle')) return;

        const note = notes.find(n => n.id === noteId);
        if (!note) return;

        const startX = e.clientX;
        const startY = e.clientY;
        const startNoteX = note.x;
        const startNoteY = note.y;

        const handleMouseMove = (moveEvent) => {
          if (!boardRef.current) return;
          const boardRect = boardRef.current.getBoundingClientRect();
          
          let newX = startNoteX + (moveEvent.clientX - startX);
          let newY = startNoteY + (moveEvent.clientY - startY);

          // 메모판 경계 제한
          newX = Math.max(0, Math.min(newX, boardRect.width - note.w));
          newY = Math.max(0, Math.min(newY, boardRect.height - note.h));

          setNotes(prev => {
            const updated = prev.map(n => n.id === noteId ? { ...n, x: newX, y: newY } : n);
            localStorage.setItem('dashboard_sticky_notes', JSON.stringify(updated));
            return updated;
          });
        };

        const handleMouseUp = () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
      };

      // 포스트잇 리사이즈 핸들러
      const handleMouseDownResize = (e, noteId) => {
        e.stopPropagation();
        e.preventDefault();

        const note = notes.find(n => n.id === noteId);
        if (!note) return;

        const startX = e.clientX;
        const startY = e.clientY;
        const startW = note.w;
        const startH = note.h;

        const handleMouseMove = (moveEvent) => {
          if (!boardRef.current) return;
          const boardRect = boardRef.current.getBoundingClientRect();

          let newW = startW + (moveEvent.clientX - startX);
          let newH = startH + (moveEvent.clientY - startY);

          // 최소 크기 제한
          newW = Math.max(120, newW);
          newH = Math.max(100, newH);

          // 메모판 경계 제한
          newW = Math.min(newW, boardRect.width - note.x);
          newH = Math.min(newH, boardRect.height - note.y);

          setNotes(prev => {
            const updated = prev.map(n => n.id === noteId ? { ...n, w: newW, h: newH } : n);
            localStorage.setItem('dashboard_sticky_notes', JSON.stringify(updated));
            return updated;
          });
        };

        const handleMouseUp = () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
      };

      const colorMap = {
        yellow: { bg: 'rgba(255, 243, 191, 0.95)', border: '#fcc419' },
        mint: { bg: 'rgba(211, 249, 216, 0.95)', border: '#51cf66' },
        pink: { bg: 'rgba(255, 219, 240, 0.95)', border: '#f783ac' },
        blue: { bg: 'rgba(208, 235, 255, 0.95)', border: '#4dabf7' },
        orange: { bg: 'rgba(255, 224, 204, 0.95)', border: '#ff922b' }
      };

      const renderCalendarGrid = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const totalDays = getDaysInMonth(year, month);
        const firstDay = getFirstDayOfMonth(year, month);
        const blanks = Array(firstDay).fill(null);
        const days = Array.from({ length: totalDays }, (_, i) => i + 1);

        const allDays = [...blanks, ...days];

        return (
          <div className="calendar-grid">
            {['일', '월', '화', '수', '목', '금', '토'].map((d, i) => (
              <div key={d} className="calendar-day-header" style={{ color: i === 0 ? 'var(--color-danger)' : i === 6 ? 'var(--color-blue)' : 'var(--text-muted)' }}>
                {d}
              </div>
            ))}
            {allDays.map((day, idx) => {
              if (day === null) {
                return <div key={`blank-${idx}`} className="calendar-day-cell" style={{ background: 'transparent', border: 'none' }} />;
              }
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const daySales = monthlySales[dateStr];
              const isToday = new Date().getDate() === day && new Date().getMonth() === month && new Date().getFullYear() === year;

              return (
                <div
                  key={`day-${day}`}
                  className={`calendar-day-cell active-day ${isToday ? 'today' : ''}`}
                >
                  <span className="calendar-day-num">{day}</span>
                  {daySales && (
                    <div className="calendar-day-data">
                      <span className="calendar-sales-count">{daySales.count}건</span>
                      <span className="calendar-sales-amount" style={{ fontSize: '9px', opacity: 0.85 }}>
                        ₩{daySales.total.toLocaleString()}
                      </span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      };

      if (loading) return <div className="content-area"><p style={{ color: 'var(--text-muted)' }}>로딩 중...</p></div>;

      return (
        <div className="content-area">
          <div className="content-header"><h1 className="content-title">대시보드 요약</h1></div>
          
          {/* KPI 지표 카드 */}
          <div className="metrics-grid">
            <div className="metric-card glass-card">
              <span className="metric-title">금일 매출</span>
              <span className="metric-value mint">₩ {metrics.todaySales.toLocaleString()}</span>
            </div>
            <div className="metric-card glass-card">
              <span className="metric-title">당월 순수익</span>
              <span className={`metric-value ${metrics.monthNetProfit >= 0 ? 'mint' : 'danger'}`}>
                ₩ {metrics.monthNetProfit.toLocaleString()}
              </span>
            </div>
            <div className="metric-card glass-card">
              <span className="metric-title">등록 상품 수</span>
              <span className="metric-value">{metrics.totalProducts} 개</span>
            </div>
            <div className="metric-card glass-card">
              <span className="metric-title">재고 부족 상품 수</span>
              <span className={`metric-value ${metrics.lowStockProducts > 0 ? 'danger' : ''}`}>{metrics.lowStockProducts} 개</span>
            </div>
          </div>

          {/* 메인 레이아웃 스택 (달력 하단에 디지털 메모판 배치) */}
          <div className="dashboard-layout-stacked">
            
            {/* 스티치 스타일 달력 */}
            <div className="calendar-container glass-card">
              <div className="calendar-header">
                <div className="calendar-title-wrapper">
                  <span className="material-symbols-outlined" style={{ color: 'var(--color-mint)', fontSize: '20px' }}>calendar_month</span>
                  <h2>월간 매출 및 판매 현황</h2>
                </div>
                <div className="calendar-nav">
                  <button className="calendar-btn" onClick={handlePrevMonth}>
                    <span className="material-symbols-outlined" style={{ fontSize: '16px' }}>chevron_left</span>
                  </button>
                  <span className="calendar-month-text">
                    {currentDate.getFullYear()}년 {currentDate.getMonth() + 1}월
                  </span>
                  <button className="calendar-btn" onClick={handleNextMonth}>
                    <span className="material-symbols-outlined" style={{ fontSize: '16px' }}>chevron_right</span>
                  </button>
                </div>
              </div>
              {renderCalendarGrid()}
            </div>

            {/* 디지털 메모장 보드 */}
            <div className="memo-board-container">
              <div className="memo-board-header">
                <div className="memo-board-title">
                  <span className="material-symbols-outlined" style={{ color: 'var(--color-mint)', fontSize: '20px' }}>note_alt</span>
                  <span>디지털 메모장</span>
                </div>
                <button className="btn btn-primary" style={{ padding: '6px 12px', fontSize: '12px' }} onClick={addStickyNote}>
                  + 포스트잇 추가
                </button>
              </div>

              <div className="memo-board" ref={boardRef}>
                {notes.map((note) => {
                  const style = colorMap[note.color] || colorMap.yellow;
                  return (
                    <div
                      key={note.id}
                      className="sticky-note"
                      style={{
                        left: `${note.x}px`,
                        top: `${note.y}px`,
                        width: `${note.w}px`,
                        height: `${note.h}px`,
                        backgroundColor: style.bg,
                        borderLeft: `5px solid ${style.border}`
                      }}
                      onMouseDown={(e) => handleMouseDownNote(e, note.id)}
                    >
                      {/* 메모 상단 드래그 헤더 */}
                      <div className="sticky-note-header">
                        <span>MEMO</span>
                        <button className="btn-delete-note" onClick={() => deleteStickyNote(note.id)} title="메모 삭제">×</button>
                      </div>
                      
                      {/* 메모 작성 바디 */}
                      <div className="sticky-note-content-wrapper">
                        <textarea
                          className="sticky-note-textarea"
                          placeholder="내용을 입력하세요..."
                          value={note.text}
                          onChange={(e) => updateNoteText(note.id, e.target.value)}
                          onMouseDown={(e) => e.stopPropagation()} // 텍스트 영역 클릭/드래그 시 전체 드래그 방지
                        />
                      </div>

                      {/* 메모 하단 색상 선택기 */}
                      <div className="sticky-note-footer" onMouseDown={(e) => e.stopPropagation()}>
                        <div className="color-dots">
                          {Object.keys(colorMap).map((colorKey) => (
                            <div
                              key={colorKey}
                              className="color-dot"
                              style={{ backgroundColor: colorMap[colorKey].bg }}
                              onClick={() => changeNoteColor(note.id, colorKey)}
                            />
                          ))}
                        </div>
                      </div>

                      {/* 우측 하단 크기 조절기 */}
                      <div
                        className="resize-handle"
                        onMouseDown={(e) => handleMouseDownResize(e, note.id)}
                      />
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 최근 매출 내역 표 */}
            <div>
              <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '12px', display: 'flex', alignItems: 'center', gap: '6px' }}>
                <span className="material-symbols-outlined" style={{ color: 'var(--color-mint)', fontSize: '18px' }}>list_alt</span>
                최근 매출 내역
              </h3>
              <div className="table-container">
                <table className="custom-table">
                  <thead>
                    <tr>
                      <th>판매일자</th>
                      <th>상품코드</th>
                      <th>상품명</th>
                      <th>수량</th>
                      <th>단가</th>
                      <th>합계</th>
                    </tr>
                  </thead>
                  <tbody>
                    {recentSales.length === 0 ? (
                      <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--text-muted)' }}>최근 판매 내역이 없습니다.</td></tr>
                    ) : (
                      recentSales.map((sale) => (
                        <tr key={sale.id}>
                          <td>{sale.sale_date}</td>
                          <td>{sale.code}</td>
                          <td>{sale.name}</td>
                          <td>{sale.quantity}</td>
                          <td>₩ {sale.selling_price.toLocaleString()}</td>
                          <td style={{ fontWeight: 'bold', color: 'var(--color-mint)' }}>₩ {sale.total_amount.toLocaleString()}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // ==========================================
    // 4. 고객 관리 컴포넌트
    // ==========================================
    function Customers({ onDataChange }) {
      const [customers, setCustomers] = useState([]);
      const [search, setSearch] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [formData, setFormData] = useState({ name: '', contact: '', grade: '일반', notes: '' });

      useEffect(() => { fetchCustomers(); }, []);

      const fetchCustomers = async (searchVal = search) => {
        try {
          let query = supabaseClient.from('customers').select('*');
          if (searchVal.trim()) {
            query = query.or(`name.ilike.%${searchVal}%,contact.ilike.%${searchVal}%`);
          }
          const { data } = await query.order('id', { ascending: false });
          setCustomers(data || []);
        } catch (err) {
          console.error(err);
        }
      };

      const handleSearchChange = (e) => {
        setSearch(e.target.value);
        fetchCustomers(e.target.value);
      };

      const openAddModal = () => {
        setSelectedCustomer(null);
        setFormData({ name: '', contact: '', grade: '일반', notes: '' });
        setIsModalOpen(true);
      };

      const openEditModal = (cust) => {
        setSelectedCustomer(cust);
        setFormData({ name: cust.name, contact: cust.contact || '', grade: cust.grade || '일반', notes: cust.notes || '' });
        setIsModalOpen(true);
      };

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        try {
          if (selectedCustomer) {

    // ==========================================
    // 5. 상품 관리 컴포넌트
    // ==========================================
    function Products({ onDataChange }) {
      const [products, setProducts] = useState([]);
      const [search, setSearch] = useState('');
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [formData, setFormData] = useState({ code: '', name: '', category: '전자기기', purchase_price: 0, selling_price: 0, stock_qty: 0 });

      const [isStockModalOpen, setIsStockModalOpen] = useState(false);
      const [stockFormData, setStockFormData] = useState({ id: null, name: '', qty: 0 });

      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [txType, setTxType] = useState('sale');
      const [txFormData, setTxFormData] = useState({ id: null, name: '', price: 0, qty: 1 });

      useEffect(() => { fetchProducts(); }, []);

      const fetchProducts = async (searchVal = search) => {
        try {
          let query = supabaseClient.from('products').select('*');
          if (searchVal.trim()) {
            query = query.or(`name.ilike.%${searchVal}%,category.ilike.%${searchVal}%,code.ilike.%${searchVal}%`);
          }
          const { data } = await query.order('code', { ascending: true });
          setProducts(data || []);
        } catch (err) {
          console.error(err);
        }
      };

      const handleProductSubmit = async (e) => {
        e.preventDefault();
        try {
          if (selectedProduct) {
            await supabaseClient.from('products').update(formData).eq('id', selectedProduct.id);
          } else {
            await supabaseClient.from('products').insert([formData]);
          }
          setIsModalOpen(false);
          fetchProducts();
          onDataChange();
        } catch (err) {
          console.error(err);
        }
      };

      const handleStockSubmit = async (e) => {
        e.preventDefault();
        try {
          await supabaseClient.from('products').update({ stock_qty: Number(stockFormData.qty) }).eq('id', stockFormData.id);
          setIsStockModalOpen(false);
          fetchProducts();
          onDataChange();
        } catch (err) {
          console.error(err);
        }
      };

      const handleTxSubmit = async (e) => {
        e.preventDefault();
        const todayStr = new Date().toISOString().substring(0, 10);
        try {
          const { data: prod } = await supabaseClient.from('products').select('stock_qty').eq('id', txFormData.id).single();
          if (txType === 'sale' && prod.stock_qty < txFormData.qty) {
            alert('재고가 부족합니다.');
            return;
          }

          if (txType === 'sale') {
            await supabaseClient.from('sales').insert([{ product_id: txFormData.id, quantity: txFormData.qty, selling_price: txFormData.price, sale_date: todayStr }]);
            await supabaseClient.from('products').update({ stock_qty: prod.stock_qty - txFormData.qty }).eq('id', txFormData.id);
          } else {
            await supabaseClient.from('purchases').insert([{ product_id: txFormData.id, quantity: txFormData.qty, purchase_price: txFormData.price, purchase_date: todayStr }]);
            await supabaseClient.from('products').update({ stock_qty: prod.stock_qty + txFormData.qty }).eq('id', txFormData.id);
          }

          setIsTxModalOpen(false);
          fetchProducts();
          onDataChange();
        } catch (err) {
          console.error(err);
        }
      };

      const handleDelete = async (prod) => {
        if (!confirm(`상품 '${prod.name}'을 삭제하시겠습니까?`)) return;
        try {
          await supabaseClient.from('products').delete().eq('id', prod.id);
          fetchProducts();
          onDataChange();
        } catch (err) {
          console.error(err);
        }
      };

      return (
        <div className="content-area">
          <div className="content-header"><h1 className="content-title">상품 및 재고 관리</h1></div>
          <div className="search-bar">
            <input type="text" className="input-control" placeholder="상품명, 카테고리 또는 코드 검색..." value={search} onChange={(e) => { setSearch(e.target.value); fetchProducts(e.target.value); }} />
            <button className="btn btn-primary" onClick={openAddModal}>신규 상품 등록</button>
          </div>
          <span style={{ color: 'var(--color-danger)', fontSize: '11px', fontWeight: 'bold', display: 'block', marginBottom: '8px' }}>
            * 재고 수량 10개 이하: 붉은색 표시 (발주 권장)
          </span>
          <div className="table-container">
            <table className="custom-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>코드</th>
                  <th>상품명</th>
                  <th>카테고리</th>
                  <th>매입가</th>
                  <th>판매가</th>
                  <th>재고</th>
                  <th style={{ textAlign: 'center' }}>수행 업무</th>
                </tr>
              </thead>
              <tbody>
                {products.map((prod) => {
                  const isLow = prod.stock_qty <= 10;
                  return (
                    <tr key={prod.id} className={isLow ? 'warning-row' : ''}>
                      <td>{prod.id}</td>
                      <td>{prod.code}</td>
                      <td style={{ fontWeight: 'bold' }}>{prod.name}</td>
                      <td>{prod.category}</td>
                      <td>₩ {prod.purchase_price.toLocaleString()}</td>
                      <td>₩ {prod.selling_price.toLocaleString()}</td>
                      <td style={{ fontWeight: 'bold', color: isLow ? 'var(--color-danger)' : 'inherit' }}>{prod.stock_qty} 개</td>
                      <td>
                        <div style={{ display: 'flex', gap: '4px', justifyContent: 'center' }}>
                          <button className="btn btn-primary" style={{ padding: '3px 6px', fontSize: '11px' }} onClick={() => { setTxType('sale'); setTxFormData({ id: prod.id, name: prod.name, price: prod.selling_price, qty: 1 }); setIsTxModalOpen(true); }}>매출</button>
                          <button className="btn" style={{ padding: '3px 6px', fontSize: '11px', backgroundColor: 'var(--color-blue)', color: '#0f0f11' }} onClick={() => { setTxType('purchase'); setTxFormData({ id: prod.id, name: prod.name, price: prod.purchase_price, qty: 10 }); setIsTxModalOpen(true); }}>입고</button>
                          <button className="btn btn-secondary" style={{ padding: '3px 6px', fontSize: '11px' }} onClick={() => { setStockFormData({ id: prod.id, name: prod.name, qty: prod.stock_qty }); setIsStockModalOpen(true); }}>조정</button>
                          <button className="btn btn-secondary" style={{ padding: '3px 6px', fontSize: '11px' }} onClick={() => openEditModal(prod)}>수정</button>
                          <button className="btn btn-danger" style={{ padding: '3px 6px', fontSize: '11px' }} onClick={() => handleDelete(prod)}>삭제</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* 모달 창들은 간소화하여 구조 정의 */}
          {isModalOpen && (
            <div className="modal-overlay" onClick={() => setIsModalOpen(false)}>
              <div className="modal-content glass-card" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header"><h3>{selectedProduct ? '상품 수정' : '신규 상품 등록'}</h3></div>
                <form onSubmit={handleProductSubmit}>
                  <div className="modal-body">
                    <div className="form-group">
                      <label>상품코드 *</label>
                      <input type="text" className="input-control" value={formData.code} onChange={(e) => setFormData({ ...formData, code: e.target.value })} disabled={!!selectedProduct} required />
                    </div>
                    <div className="form-group">
                      <label>상품명 *</label>
                      <input type="text" className="input-control" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>매입가 *</label>
                      <input type="number" className="input-control" value={formData.purchase_price} onChange={(e) => setFormData({ ...formData, purchase_price: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>판매가 *</label>
                      <input type="number" className="input-control" value={formData.selling_price} onChange={(e) => setFormData({ ...formData, selling_price: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label>초기재고</label>
                      <input type="number" className="input-control" value={formData.stock_qty} onChange={(e) => setFormData({ ...formData, stock_qty: e.target.value })} />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsModalOpen(false)}>취소</button>
                    <button type="submit" className="btn btn-primary">저장</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 재고 조정 */}
          {isStockModalOpen && (
            <div className="modal-overlay" onClick={() => setIsStockModalOpen(false)}>
              <div className="modal-content glass-card" onClick={(e) => e.stopPropagation()} style={{ width: '320px' }}>
                <div className="modal-header"><h3>재고 조정</h3></div>
                <form onSubmit={handleStockSubmit}>
                  <div className="modal-body">
                    <div className="form-group"><label>상품명</label><div style={{ color: 'var(--color-mint)', fontWeight: 'bold' }}>{stockFormData.name}</div></div>
                    <div className="form-group"><label>재고수량</label><input type="number" className="input-control" value={stockFormData.qty} onChange={(e) => setStockFormData({ ...stockFormData, qty: e.target.value })} min="0" required /></div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsStockModalOpen(false)}>취소</button>
                    <button type="submit" className="btn btn-primary">적용</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 매출 / 입고 모달 */}
          {isTxModalOpen && (
            <div className="modal-overlay" onClick={() => setIsTxModalOpen(false)}>
              <div className="modal-content glass-card" onClick={(e) => e.stopPropagation()} style={{ width: '320px' }}>
                <div className="modal-header"><h3>{txType === 'sale' ? '매출 수동 등록' : '매입 입고 등록'}</h3></div>
                <form onSubmit={handleTxSubmit}>
                  <div className="modal-body">
                    <div className="form-group"><label>상품명</label><div style={{ color: txType === 'sale' ? 'var(--color-mint)' : 'var(--color-blue)', fontWeight: 'bold' }}>{txFormData.name}</div></div>
                    <div className="form-group"><label>단가</label><div>₩ {txFormData.price.toLocaleString()}</div></div>
                    <div className="form-group"><label>수량</label><input type="number" className="input-control" value={txFormData.qty} onChange={(e) => setTxFormData({ ...txFormData, qty: e.target.value })} min="1" required /></div>
                    <div className="form-group"><label>총합계</label><div style={{ fontSize: '15px', fontWeight: 'bold' }}>₩ {(txFormData.price * txFormData.qty).toLocaleString()}</div></div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsTxModalOpen(false)}>취소</button>
                    <button type="submit" className="btn btn-primary" style={{ backgroundColor: txType === 'sale' ? 'var(--color-mint)' : 'var(--color-blue)', color: '#0f0f11' }}>등록</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );

      function openAddModal() {
        setSelectedProduct(null);
        setFormData({ code: '', name: '', category: '전자기기', purchase_price: 0, selling_price: 0, stock_qty: 0 });
        setIsModalOpen(true);
      }

      function openEditModal(prod) {
        setSelectedProduct(prod);
        setFormData({ code: prod.code, name: prod.name, category: prod.category || '전자기기', purchase_price: prod.purchase_price, selling_price: prod.selling_price, stock_qty: prod.stock_qty });
        setIsModalOpen(true);
      }
    }

    // ==========================================
    // 6. 직원 및 정산 관리 컴포넌트
    // ==========================================
    function Employees({ onDataChange }) {
      const [employees, setEmployees] = useState([]);
      const [selectedEmp, setSelectedEmp] = useState(null);
      const [workRecords, setWorkRecords] = useState([]);
      const [payrollHistory, setPayrollHistory] = useState(null);
      const [loading, setLoading] = useState(true);

      const [months, setMonths] = useState([]);
      const [selectedMonth, setSelectedMonth] = useState('');

      const [isEmpModalOpen, setIsEmpModalOpen] = useState(false);
      const [empModalData, setEmpModalData] = useState(null);
      const [empFormData, setEmpFormData] = useState({ name: '', position: '알바', salary_type: '시급', base_salary: 0 });

      const [workFormData, setWorkFormData] = useState({ date: new Date().toISOString().substring(0, 10), hours: 8, notes: '' });

      useEffect(() => {
        const generatedMonths = [];
        const localDate = new Date();
        const currentYear = localDate.getFullYear();
        const currentMonth = localDate.getMonth() + 1;
        for (let i = 0; i < 6; i++) {
          let m = currentMonth - i;
          let y = currentYear;
          if (m <= 0) { m += 12; y -= 1; }
          generatedMonths.push(`${y}-${String(m).padStart(2, '0')}`);
        }
        setMonths(generatedMonths);
        setSelectedMonth(generatedMonths[0]);
        fetchEmployees();
      }, []);

      useEffect(() => {
        if (selectedEmp && selectedMonth) {
          fetchEmployeeDetails();
        }
      }, [selectedEmp, selectedMonth]);

      const fetchEmployees = async () => {
        setLoading(true);
        try {
          const { data } = await supabaseClient.from('employees').select('*').order('id', { ascending: true });
          setEmployees(data || []);
        } catch (err) { console.error(err); }
        finally { setLoading(false); }
      };

      const fetchEmployeeDetails = async () => {
        try {
          const { data: records } = await supabaseClient.from('work_records').select('*').eq('employee_id', selectedEmp.id).like('work_date', `${selectedMonth}%`).order('work_date', { ascending: false });
          setWorkRecords(records || []);

          const { data: history } = await supabaseClient.from('payrolls').select('*').eq('employee_id', selectedEmp.id).eq('settlement_month', selectedMonth).maybeSingle();
          setPayrollHistory(history);
        } catch (err) { console.error(err); }
      };

      const handleEmpSubmit = async (e) => {
        e.preventDefault();
        try {
          if (empModalData) {
            await supabaseClient.from('employees').update(empFormData).eq('id', empModalData.id);
            if (selectedEmp?.id === empModalData.id) setSelectedEmp({ ...selectedEmp, ...empFormData });
          } else {
            await supabaseClient.from('employees').insert([empFormData]);
          }
          setIsEmpModalOpen(false);
          fetchEmployees();
        } catch (err) { console.error(err); }
      };

      const handleEmpDelete = async (emp) => {
        if (!confirm(`직원 '${emp.name}' 정보를 삭제하시겠습니까?`)) return;
        try {
          await supabaseClient.from('employees').delete().eq('id', emp.id);
          if (selectedEmp?.id === emp.id) setSelectedEmp(null);
          fetchEmployees();
          onDataChange();
        } catch (err) { console.error(err); }
      };

      const handleAddWorkRecord = async (e) => {
        e.preventDefault();
        try {
          await supabaseClient.from('work_records').insert([{ employee_id: selectedEmp.id, work_date: workFormData.date, hours_worked: Number(workFormData.hours), notes: workFormData.notes.trim() }]);
          setWorkFormData({ ...workFormData, notes: '' });
          fetchEmployeeDetails();
          onDataChange();
        } catch (err) { console.error(err); }
      };

      const handleDeleteWorkRecord = async (recId) => {
        try {
          await supabaseClient.from('work_records').delete().eq('id', recId);
          fetchEmployeeDetails();
          onDataChange();
        } catch (err) { console.error(err); }
      };

      const calculateFinalSalary = () => {
        if (!selectedEmp) return 0;
        if (selectedEmp.salary_type === '월급') return selectedEmp.base_salary;
        const hours = workRecords.reduce((sum, r) => sum + r.hours_worked, 0);
        return Math.round(hours * selectedEmp.base_salary);
      };

      const handleSettlePayroll = async () => {
        const finalSal = calculateFinalSalary();
        const todayStr = new Date().toISOString().substring(0, 10);
        if (!confirm(`직원 '${selectedEmp.name}'의 ${selectedMonth} 급여를 정산 처리하시겠습니까?`)) return;
        try {
          const { error } = await supabaseClient.from('payrolls').insert([{ employee_id: selectedEmp.id, settlement_month: selectedMonth, calculated_salary: finalSal, settlement_date: todayStr, status: '정산 완료' }]);
          if (error) { alert('이미 정산이 완료된 달입니다.'); }
          else {
            fetchEmployeeDetails();
            onDataChange();
          }
        } catch (err) { console.error(err); }
      };

      const totalWorked = workRecords.reduce((sum, r) => sum + r.hours_worked, 0);
      const calculatedSalary = calculateFinalSalary();

      return (
        <div className="content-area">
          <div className="content-header"><h1 className="content-title">직원 근무 관리 및 정산</h1></div>
          <div className="splitter-container">
            <div className="splitter-left glass-card" style={{ padding: '16px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px' }}>
                <h4 style={{ fontWeight: 'bold' }}>직원 목록</h4>
                <button className="btn btn-primary" style={{ padding: '4px 8px', fontSize: '11px' }} onClick={() => { setEmpModalData(null); setEmpFormData({ name: '', position: '알바', salary_type: '시급', base_salary: 10000 }); setIsEmpModalOpen(true); }}>추가</button>
              </div>
              <div className="table-container" style={{ maxHeight: '400px', overflowY: 'auto' }}>
                <table className="custom-table" style={{ fontSize: '12px' }}>
                  <thead>
                    <tr><th>이름</th><th>직급</th><th>유형</th><th>시급/기본급</th><th>관리</th></tr>
                  </thead>
                  <tbody>
                    {employees.map((emp) => (
                      <tr key={emp.id} onClick={() => setSelectedEmp(emp)} style={{ backgroundColor: selectedEmp?.id === emp.id ? 'rgba(0,245,212,0.08)' : '' }}>
                        <td>{emp.name}</td><td>{emp.position}</td><td>{emp.salary_type}</td><td>₩ {emp.base_salary.toLocaleString()}</td>
                        <td>
                          <button className="btn btn-secondary" style={{ padding: '2px 5px', fontSize: '10px', marginRight: '3px' }} onClick={(e) => { e.stopPropagation(); setEmpModalData(emp); setEmpFormData({ name: emp.name, position: emp.position, salary_type: emp.salary_type, base_salary: emp.base_salary }); setIsEmpModalOpen(true); }}>수정</button>
                          <button className="btn btn-danger" style={{ padding: '2px 5px', fontSize: '10px' }} onClick={(e) => { e.stopPropagation(); handleEmpDelete(emp); }}>삭제</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="splitter-right glass-card" style={{ padding: '16px' }}>
              {selectedEmp ? (
                <>
                  <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--border-color)', paddingBottom: '8px' }}>
                    <h3 style={{ color: 'var(--color-mint)' }}>{selectedEmp.name} {selectedEmp.position}</h3>
                    <select className="input-control" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} style={{ padding: '3px 6px', fontSize: '12px' }}>
                      {months.map((m) => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>

                  <form onSubmit={handleAddWorkRecord} style={{ display: 'flex', gap: '6px', margin: '12px 0' }}>
                    <input type="date" className="input-control" value={workFormData.date} onChange={(e) => setWorkFormData({ ...workFormData, date: e.target.value })} style={{ flex: 2, padding: '4px' }} required />
                    <input type="number" className="input-control" value={workFormData.hours} onChange={(e) => setWorkFormData({ ...workFormData, hours: e.target.value })} style={{ flex: 1.5, padding: '4px' }} step="0.5" required />
                    <input type="text" className="input-control" placeholder="메모" value={workFormData.notes} onChange={(e) => setWorkFormData({ ...workFormData, notes: e.target.value })} style={{ flex: 3, padding: '4px' }} />
                    <button type="submit" className="btn btn-primary" style={{ padding: '4px 10px', fontSize: '12px' }}>추가</button>
                  </form>

                  <div style={{ maxHeight: '160px', overflowY: 'auto', border: '1px solid var(--border-color)', borderRadius: '6px', marginBottom: '12px' }}>
                    <table className="custom-table" style={{ fontSize: '11px' }}>
                      <thead><tr><th>날짜</th><th>근무량</th><th>비고</th><th>삭제</th></tr></thead>
                      <tbody>
                        {workRecords.map((r) => (
                          <tr key={r.id}>
                            <td>{r.work_date}</td><td>{r.hours_worked}</td><td>{r.notes || '-'}</td>
                            <td><button className="btn btn-danger" style={{ padding: '2px 5px', fontSize: '10px' }} onClick={() => handleDeleteWorkRecord(r.id)}>삭제</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="payroll-box">
                    <h4 style={{ fontSize: '13px' }}>급여 정산 요약</h4>
                    <div className="payroll-summary-grid">
                      <span className="payroll-summary-label">기본 급여:</span>
                      <span className="payroll-summary-value">₩ {selectedEmp.base_salary.toLocaleString()} ({selectedEmp.salary_type})</span>
                      <span className="payroll-summary-label">총 근무량:</span>
                      <span className="payroll-summary-value">{totalWorked} {selectedEmp.salary_type === '시급' ? '시간' : '일'}</span>
                      <span className="payroll-summary-label">계산된 급여:</span>
                      <span className="payroll-summary-value highlight">₩ {calculatedSalary.toLocaleString()}</span>
                      <span className="payroll-summary-label font-bold">정산상태:</span>
                      <span className="payroll-summary-value">{payrollHistory ? <span className="status-tag settled">정산 완료 ({payrollHistory.settlement_date})</span> : <span className="status-tag unsettled">미정산</span>}</span>
                    </div>
                    {!payrollHistory ? <button className="btn btn-primary" style={{ width: '100%', marginTop: '6px' }} onClick={handleSettlePayroll}>급여 정산 완료 처리</button> : <button className="btn btn-secondary" style={{ width: '100%', marginTop: '6px', cursor: 'not-allowed' }} disabled>정산 완료됨</button>}
                  </div>
                </>
              ) : (
                <div style={{ display: 'flex', height: '100%', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>직원을 선택해주세요.</div>
              )}
            </div>
          </div>

          {isEmpModalOpen && (
            <div className="modal-overlay" onClick={() => setIsEmpModalOpen(false)}>
              <div className="modal-content glass-card" onClick={(e) => e.stopPropagation()} style={{ width: '320px' }}>
                <div className="modal-header"><h3>{empModalData ? '직원 수정' : '신규 직원 등록'}</h3></div>
                <form onSubmit={handleEmpSubmit}>
                  <div className="modal-body">
                    <div className="form-group"><label>직원명 *</label><input type="text" className="input-control" value={empFormData.name} onChange={(e) => setEmpFormData({ ...empFormData, name: e.target.value })} required /></div>
                    <div className="form-group"><label>직급</label>
                      <select className="input-control" value={empFormData.position} onChange={(e) => setEmpFormData({ ...empFormData, position: e.target.value })}>
                        <option value="알바">알바</option><option value="스태프">스태프</option><option value="매니저">매니저</option><option value="점장">점장</option>
                      </select>
                    </div>
                    <div className="form-group"><label>급여유형</label>
                      <select className="input-control" value={empFormData.salary_type} onChange={(e) => setEmpFormData({ ...empFormData, salary_type: e.target.value })}>
                        <option value="시급">시급</option><option value="월급">월급</option>
                      </select>
                    </div>
                    <div className="form-group"><label>기본급 *</label><input type="number" className="input-control" value={empFormData.base_salary} onChange={(e) => setEmpFormData({ ...empFormData, base_salary: e.target.value })} required /></div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsEmpModalOpen(false)}>취소</button>
                    <button type="submit" className="btn btn-primary">저장</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. 통계 및 정산원장 컴포넌트
    // ==========================================
    function Finance() {
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [ledger, setLedger] = useState([]);
      const [summary, setSummary] = useState({ salesTotal: 0, purchaseTotal: 0, netProfit: 0 });
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        
        setStartDate(`${year}-${month}-01`);
        setEndDate(`${year}-${month}-${day}`);
        fetchFinancialData(`${year}-${month}-01`, `${year}-${month}-${day}`);
      }, []);

      const fetchFinancialData = async (start = startDate, end = endDate) => {
        if (!start || !end) return;
        setLoading(true);
        try {
          const { data: sales } = await supabaseClient.from('sales').select(`sale_date, quantity, selling_price, products (name)`).between('sale_date', start, end);
          const salesList = (sales || []).map((s) => ({ date: s.sale_date, type: '매출', detail: `${s.products?.name || '삭제된 상품'} ${s.quantity}개 판매`, amount: s.quantity * s.selling_price }));

          const { data: purchases } = await supabaseClient.from('purchases').select(`purchase_date, quantity, purchase_price, products (name)`).between('purchase_date', start, end);
          const purchaseList = (purchases || []).map((p) => ({ date: p.purchase_date, type: '매입', detail: `${p.products?.name || '삭제된 상품'} ${p.quantity}개 입고`, amount: -(p.quantity * p.purchase_price) }));

          const { data: payrolls } = await supabaseClient.from('payrolls').select(`settlement_date, settlement_month, calculated_salary, employees (name)`).between('settlement_date', start, end);
          const payrollList = (payrolls || []).map((pa) => ({ date: pa.settlement_date, type: '인건비', detail: `${pa.employees?.name || '퇴사직원'} (${pa.settlement_month}) 급여`, amount: -pa.calculated_salary }));

          const unified = [...salesList, ...purchaseList, ...payrollList];
          unified.sort((a, b) => new Date(b.date) - new Date(a.date));
          setLedger(unified);

          let sSum = 0;
          let pSum = 0;
          unified.forEach((item) => {
            if (item.amount > 0) sSum += item.amount;
            else pSum += Math.abs(item.amount);
          });

          setSummary({ salesTotal: sSum, purchaseTotal: pSum, netProfit: sSum - pSum });
        } catch (err) { console.error(err); }
        finally { setLoading(false); }
      };

      const handleExportCSV = () => {
        if (ledger.length === 0) return;
        const headers = ['거래일자', '구분', '상세내역', '금액(원)'];
        const csvContent = headers.join(',') + '\n' + ledger.map(r => [r.date, r.type, r.detail, r.amount].map(v => `"${v}"`).join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Ledger_${startDate}_to_${endDate}.csv`;
        link.click();
      };

      return (
        <div className="content-area">
          <div className="content-header"><h1 className="content-title">매출 매입 및 순수익 통계</h1></div>
          <div className="search-bar" style={{ alignItems: 'center' }}>
            <span style={{ fontSize: '12px' }}>시작:</span>
            <input type="date" className="input-control" value={startDate} onChange={(e) => setStartDate(e.target.value)} style={{ width: '135px', padding: '4px 8px' }} />
            <span style={{ fontSize: '12px' }}>종료:</span>
            <input type="date" className="input-control" value={endDate} onChange={(e) => setEndDate(e.target.value)} style={{ width: '135px', padding: '4px 8px' }} />
            <button className="btn btn-secondary" style={{ padding: '6px 12px' }} onClick={() => fetchFinancialData()}>조회</button>
            <button className="btn btn-primary" style={{ padding: '6px 12px' }} onClick={handleExportCSV}>CSV 다운로드</button>
          </div>
          <div className="metrics-grid">
            <div className="metric-card glass-card">
              <span className="metric-title">기간 매출 합계</span>
              <span className="metric-value mint">₩ {summary.salesTotal.toLocaleString()}</span>
            </div>
            <div className="metric-card glass-card">
              <span className="metric-title">기간 매입 합계 (인건비 포함)</span>
              <span className="metric-value">₩ {summary.purchaseTotal.toLocaleString()}</span>
            </div>
            <div className="metric-card glass-card">
              <span className="metric-title">최종 순수익</span>
              <span className={`metric-value ${summary.netProfit >= 0 ? 'mint' : 'danger'}`}>₩ {summary.netProfit.toLocaleString()}</span>
            </div>
          </div>
          <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '12px' }}>상세 거래 원장</h3>
          <div className="table-container">
            <table className="custom-table">
              <thead><tr><th>일자</th><th>구분</th><th>상세내역</th><th style={{ textAlign: 'right' }}>금액</th></tr></thead>
              <tbody>
                {ledger.map((item, idx) => {
                  const isPositive = item.amount > 0;
                  return (
                    <tr key={idx}>
                      <td>{item.date}</td>
                      <td>
                        <span className={`status-tag ${item.type === '매출' ? 'settled' : item.type === '매입' ? 'unsettled' : ''}`} style={{ backgroundColor: item.type === '인건비' ? 'rgba(0,180,216,0.15)' : '', color: item.type === '인건비' ? 'var(--color-blue)' : '' }}>
                          {item.type}
                        </span>
                      </td>
                      <td>{item.detail}</td>
                      <td style={{ textAlign: 'right', fontWeight: 'bold', color: isPositive ? 'var(--color-mint)' : 'var(--color-danger)' }}>
                        {isPositive ? '+' : '-'} ₩ {Math.abs(item.amount).toLocaleString()}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. 메인 App 통합 컴포넌트
    // ==========================================
    function App() {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [refreshKey, setRefreshKey] = useState(0);

      const triggerRefresh = () => setRefreshKey(prev => prev + 1);

      if (!user) {
        return <Login onLoginSuccess={setUser} />;
      }

      return (
        <div className="app-container">
          <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} user={user} onLogout={() => setUser(null)} />
          <div className="content-area" key={refreshKey}>
            {activeTab === 'dashboard' && <Dashboard />}
            {activeTab === 'customers' && <Customers onDataChange={triggerRefresh} />}
            {activeTab === 'products' && <Products onDataChange={triggerRefresh} />}
            {activeTab === 'employees' && <Employees onDataChange={triggerRefresh} />}
            {activeTab === 'finance' && <Finance />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
